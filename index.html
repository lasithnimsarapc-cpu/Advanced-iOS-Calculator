<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced iOS Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="dark-theme"> <div class="app-container">
        <div class="calculator">
            <div class="top-controls">
                <button class="control-btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.3 22h-.1c-5.5-.1-10-4.6-10-10.2 0-3.9 2.3-7.4 5.7-8.9.4-.2.8 0 .9.4.2.4 0 .8-.4.9-2.9 1.3-4.8 4.2-4.8 7.5 0 4.7 3.8 8.5 8.5 8.6 3.3 0 6.2-1.9 7.5-4.8.2-.4.6-.5.9-.4.4.2.5.6.4.9-1.5 3.4-5 5.7-8.9 5.7z"/></svg>
                </button>
                <button class="control-btn" onclick="toggleHistoryPanel()" title="View History">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M12.5 2C6.7 2 2 6.7 2 12.5S6.7 22 12.5 22 23 17.3 23 12.5 18.3 2 12.5 2zm0 18c-4.1 0-7.5-3.4-7.5-7.5S8.4 5 12.5 5 20 8.4 20 12.5 16.6 20 12.5 20zm.5-11h-1v5l4.3 2.5.5-.8-3.8-2.2V9z"/></svg>
                </button>
            </div>

            <div class="screen">
                <div class="history" id="history"></div>
                <div class="display" id="display">0</div>
            </div>

            <div class="buttons">
                <button class="btn functional" onclick="backspace()">⌫</button>
                <button class="btn functional" onclick="clearDisplay()">AC</button>
                <button class="btn functional" onclick="appendCharacter('%')">%</button>
                <button class="btn operator" onclick="appendCharacter('/')">÷</button>
                
                <button class="btn number" onclick="appendCharacter('7')">7</button>
                <button class="btn number" onclick="appendCharacter('8')">8</button>
                <button class="btn number" onclick="appendCharacter('9')">9</button>
                <button class="btn operator" onclick="appendCharacter('*')">×</button>
                
                <button class="btn number" onclick="appendCharacter('4')">4</button>
                <button class="btn number" onclick="appendCharacter('5')">5</button>
                <button class="btn number" onclick="appendCharacter('6')">6</button>
                <button class="btn operator" onclick="appendCharacter('-')">−</button>
                
                <button class="btn number" onclick="appendCharacter('1')">1</button>
                <button class="btn number" onclick="appendCharacter('2')">2</button>
                <button class="btn number" onclick="appendCharacter('3')">3</button>
                <button class="btn operator" onclick="appendCharacter('+')">+</button>

                <button class="btn number" onclick="toggleSign()">+/−</button>
                <button class="btn number" onclick="appendCharacter('0')">0</button>
                <button class="btn number" onclick="appendCharacter('.')">.</button>
                <button class="btn operator" onclick="calculate()">=</button>
            </div>
        </div>

        <div class="history-panel" id="history-panel">
            <div class="panel-header">
                <button class="close-panel-btn" onclick="toggleHistoryPanel()" title="Close History">×</button>
                <h3>Calculation History</h3>
                <button class="clear-history-btn" onclick="clearSavedHistory()">Clear Logs</button>
            </div>
            <div class="history-list" id="history-list">
                <div class="empty-msg">No recent calculations</div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
